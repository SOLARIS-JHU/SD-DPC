# SINDy system identification for the continuous Two-Tank model.
seed: 0
nsim: 2000
nsteps: 5
bs: 2000
weight_decay: 0.01
lr: 1.0e-3
epochs: 20000
warmup: 300
patience: 50
threshold: 5.0e-3
prune_every: 5000
threshold_mult: 1.0
prune_noise: 0.05
l1_decay: 0.3
verbosity: 500
weights: {onestep_coef: 1.0, ref_coef: 2.0, l1_coef: 3.0e-6}
# Algorithm 1: refit coefficients on the selected support without the L1 penalty.
debias:
  enabled: true
  epochs: 1000
  learning_rate: initial_training_rate
