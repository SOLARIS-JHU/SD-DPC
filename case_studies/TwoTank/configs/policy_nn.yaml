# NN-DPC uses the same TwoTank data, horizon, objective, constraints, and coefficients.
# Its sigmoid-bounded output is smooth, so the inherited STE setting applies only to SD-DPC.
inherit: policy.yaml
policy_type: nn
layers: [32, 32]
activation: relu
lr: 0.005
epochs: 1000
warmup: 100
patience: 200
