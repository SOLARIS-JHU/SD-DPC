# Policy training configuration used by the included SD-DPC checkpoint.
# NN-DPC uses the same data and objective with the overrides under nn_training.
seed: 0
policy_seed: 0
action_scale: 1.0
action_gradient_mode: leaky_straight_through
action_gradient_band: 0.05
action_gradient_leak: 0.01
nsteps: 50
n_samples: 2000
batch_size: 200
seed_data: 5
eval_seed: 0
eval_margin: 0.1
lr: 0.005
grad_clip: 5.0
proximal_l1: false
epochs: 12000
threshold: 0.2
prune_every: 800
max_unchange: 3
prune_every_min: 800
prune_every_decay: 0
change_prune_every: false
threshold_mult: 1.0
threshold_max: 0.2
prune_noise: 0.0
lr_decay_enabled: true
lr_decay_gamma: 0.97
lr_decay_step: 100
l1_decay: 1.0
warmup: 100
patience: 50
verbosity: 10
logger_metrics:
- train_loss
- dev_loss
- train_tracking_loss
- dev_tracking_loss
- train_l1_loss
- dev_l1_loss
- train_constraint_loss
- dev_constraint_loss
- learning_rate
- unchanged_prune_count
weights:
  Q_con: 20.0
  Q_du: 0.0
  Q_dx: 0.0
  Q_r: 20.0
  Q_u: 0.0
  l1_coef: 0.1
debias:
  enabled: true
  stable_pruning_stages: 3
  epochs: 800
  learning_rate: initial_training_rate
  require_plateau: true
expected_final_terms_per_output:
- 4
- 2
nn_policy:
  layers:
  - 32
  - 32
  activation: gelu
nn_training:
  lr: 0.005
  epochs: 1000
  warmup: 100
  patience: 200
nn_distillation:
  train_scenarios: 48
  train_seed: 71001
  train_horizon: 1000
  validation_scenarios: 500
  validation_seed: 20260925
  validation_horizon: 1000
