# Paper Table I. Stage 1 - SINDy system identification (DoubleIntegrator, discrete A/B plant).
seed: 0
# --- data ---
nsim: 1500
nsteps: 3
bs: 1500
x0_range: [-20.0, 20.0]
# --- optimiser / schedule ---
weight_decay: 0.01
lr: 1.0e-3
epochs: 20000
warmup: 300
patience: 50
# --- pruning ---
threshold: 0.01
prune_every: 5000
threshold_mult: 1.05
prune_noise: 0.05
l1_decay: 0.3
verbosity: 500
# --- loss weights ---
weights:
  onestep_coef: 1.0
  ref_coef: 2.0
  l1_coef: 1.0e-9
# Algorithm 1: refit coefficients on the selected support without the L1 penalty.
debias:
  enabled: true
  epochs: 1000
  learning_rate: initial_training_rate
