# Fixed-controller evaluation with the included checkpoints.
inherit: policy.yaml
seed: 20260925
n_seeds: 500
eval_nsteps: 100
evaluation_plant: nominal
weights:
  Q_con_du: 1.0
bands:
  obstacle: 0.5
  box: 0.5
  du: 0.01
du_max: 0.2
reach_tolerance: 0.05
reach_hold_steps: 5
methods:
- sd_dpc
- nn_dpc
nn_policy:
  layers:
  - 32
  - 32
  activation: gelu
inference_benchmark:
  warmup: 10
  repeats: 200
  iters: 1000
  batch_size: 1
  seed: 0
  compiled: true
mpc:
  mode: dpc_open_loop
  integration_method: euler
  match_dpc_constraints: true
  enforce_state_bounds: true
  enforce_safety_constraints: true
  enforce_control_rate_constraints: true
  enforce_terminal_reference: true
  terminal_reference_tolerance: 0.0
  constraint_margin: 0.0001
  state_bound_margin: 0.0001
  control_rate_margin: 1.0e-05
  warm_start: true
  max_iter: 3000
  tol: 1.0e-08
  acceptable_tol: 1.0e-07
  acceptable_iter: 10
  print_level: 0
sindy_path: checkpoints/dynamics_sindy.pt
policy_path: checkpoints/policy_sparse.pt
nn_policy_path: checkpoints/policy_nn.pth
