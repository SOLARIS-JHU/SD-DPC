# Paper Table I training parameters; saved checkpoints have separate recorded-run configs.
seed: 0
policy_seed: 5
init_scale: 0.01
action_scale: 1.0
action_gradient_mode: leaky_straight_through
action_gradient_band: 0.5
action_gradient_leak: 0.1
nsteps: 100
n_samples: 2000
batch_size: 200
eval_seed: 0
eval_margin: 0.1
init_center:
- 3
- -3
init_side: 2.0
ref_center:
- -3
- 3
ref_side: 2.0
refstep: 1
ellipse:
  b: 1
  c: 0.0
  d: 0.0
  p: 3
  theta: 0.0
weight_decay: 0.01
lr: 0.0005
grad_clip: 1.0
proximal_l1: false
epochs: 12000
threshold: 0.004
prune_every: 800
max_unchange: 3
prune_every_min: 800
prune_every_decay: 0
change_prune_every: false
threshold_mult: 1.0
threshold_max: 0.004
prune_noise: 0.0
lr_decay_enabled: true
lr_decay_gamma: 0.99
lr_decay_step: 100
l1_decay: 1.0
warmup: 100
patience: 50
verbosity: 10
logger_metrics:
- train_loss
- dev_loss
- train_tracking_loss
- dev_tracking_loss
- train_l1_loss
- dev_l1_loss
- train_constraint_loss
- dev_constraint_loss
- train_total_control_action_l1
- dev_total_control_action_l1
- learning_rate
- unchanged_prune_count
weights:
  Q_con_obs: 100.0
  Q_con_u: 1.0
  Q_con_x: 1.0
  Q_du: 10.0
  Q_dx: 1.0
  Q_r: 1.0
  Q_u: 10.0
  Q_uf: 5.0
  l1_coef: 0.016
debias:
  enabled: true
  stable_pruning_stages: 3
  epochs: 1000
  learning_rate: initial_training_rate
  require_plateau: true
